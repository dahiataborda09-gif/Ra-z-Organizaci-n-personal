debar{display:none}.stats{gap:7px}.stat{padding:10px}.num{font-size:23px}.areas{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:12px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#fffdf9ed;border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:4}.mobile button{border:0;background:none;color:var(--muted);font-size:10px}.mobile button span{display:block;font-size:18px}.day{min-height:65px;padding:3px}.chip{font-size:7px;padding:3px}.weekday{font-size:8px}.week{gap:3px}.weekdaybox{min-height:110px;font-size:10px}.toolbar{flex-wrap:wrap}.toolbar h3{font-size:15px}}

<script>
const A=[['personal','Personal','♡','#e6b9b0','Tu tiempo y tus asuntos'],['laboral','Laboral','▣','#a9bfd7','Responsabilidades y proyectos'],['publicaciones','Publicaciones','✳','#d5c2a9','Ideas y calendario editorial'],['hogar','Hogar','⌂','#b8cbb1','Tu espacio y tareas del hogar'],['finanzas','Finanzas','$','#b7c9ad','Presupuesto, pagos y ahorro'],['espiritual','Vida espiritual','☼','#c9b8d7','Lecturas, oración y reflexión'],['habitos','Hábitos','↗','#e5d09d','Objetivos y rutinas']];const KEY='raiz-v02';let S=load(),view='home',area=null,mode='month',cal=new Date(),smode='month',scal=new Date(),brandfilter='all',platformfilter='all',editing=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)return{tasks:[],events:[],posts:[],notes:''};const map={trabajo:'laboral',redes:'publicaciones',fe:'espiritual',metas:'habitos'};[...(x.tasks||[]),...(x.events||[])].forEach(i=>{if(map[i.area])i.area=map[i.area]});return x}catch{return{tasks:[],events:[],posts:[],notes:''}}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function D(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function plus(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function mon(d){return plus(d,-((d.getDay()+6)%7))}function label(s){return s?D(s).toLocaleDateString('es-CO',{day:'numeric',month:'short'}):'Sin fecha'}function an(id){return A.find(a=>a[0]===id)?.[1]||'Personal'}function ac(id){return A.find(a=>a[0]===id)?.[3]||'#d5c2a9'}function now(){return iso(new Date())}document.getElementById('today').textContent=new Date().toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
function taskRows(ts){return ts.length?'<div class="tasks">'+ts.map(t=>`<div class="task ${t.done?'done':''}"><input style="width:auto" type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div class="taskmain"><div class="tasktitle">${esc(t.title)}</div><div class="meta">${an(t.area)} · ${label(t.date)} ${t.project?'· '+esc(t.project):''}</div></div><button class="btn" data-edit-task="${t.id}">Editar</button><button class="btn" data-del-task="${t.id}">×</button></div>`).join('')+'</div>':'<div class="empty">Aún no hay tareas. Agrega la primera cuando quieras 🌿</div>'}function cards(){return '<div class="areas">'+A.map(a=>`<div class="card" data-area="${a[0]}"><div class="ico" style="color:${a[3]}">${a[2]}</div><h4>${a[1]}</h4><p>${a[4]}</p><div class="meta">${S.tasks.filter(t=>t.area===a[0]&&!t.done).length} pendientes</div></div>`).join('')+'</div>'}function stats(){let o=S.tasks.filter(t=>!t.done);return `<div class="stats"><div class="stat"><small>Pendientes</small><div class="num">${o.length}</div></div><div class="stat"><small>Para hoy o atrasadas</small><div class="num">${o.filter(t=>t.date&&t.date<=now()).length}</div></div><div class="stat"><small>Completadas</small><div class="num">${S.tasks.length-o.length}</div></div></div>`}
function easterSunday(year){let a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(year,month-1,day,12)}function moveToMonday(d){let x=new Date(d);while(x.getDay()!==1)x=plus(x,1);return x}function colombianHolidays(year){let out=[];const add=(date,name)=>out.push({date:iso(date),title:name,type:'holiday',color:'#d9c7a8'});const fixed=[['01-01','Año Nuevo'],['05-01','Día del Trabajo'],['07-20','Día de la Independencia'],['08-07','Batalla de Boyacá'],['12-08','Inmaculada Concepción'],['12-25','Navidad']];fixed.forEach(([md,n])=>add(D(`${year}-${md}`),n));const emiliani=[['01-06','Día de los Reyes Magos'],['03-19','Día de San José'],['06-29','San Pedro y San Pablo'],['08-15','Asunción de la Virgen'],['10-12','Día de la Raza'],['11-01','Todos los Santos'],['11-11','Independencia de Cartagena']];emiliani.forEach(([md,n])=>{let date=D(`${year}-${md}`);add(moveToMonday(date),n)});const easter=easterSunday(year);add(plus(easter,-3),'Jueves Santo');add(plus(easter,-2),'Viernes Santo');add(moveToMonday(plus(easter,39)),'Ascensión del Señor');add(moveToMonday(plus(easter,60)),'Corpus Christi');add(moveToMonday(plus(easter,68)),'Sagrado Corazón de Jesús');return out}function holidaysForDate(date){return colombianHolidays(date.getFullYear()).filter(h=>h.date===iso(date))}function items(d,social=false){let ds=iso(d);if(social)return S.posts.filter(p=>p.date===ds&&(brandfilter==='all'||p.brand===brandfilter)&&(platformfilter==='all'||p.platform===platformfilter)).map(p=>({...p,type:'post',color:'#b8cbb1'}));return [...holidaysForDate(d),...S.events.filter(e=>e.date===ds).map(e=>({...e,type:'event',color:ac(e.area)})),...S.tasks.filter(t=>t.date===ds&&!t.done).map(t=>({...t,type:'task',color:ac(t.area),title:t.title,tag:t.project}))]}function chip(x){return `<span class="chip" style="background:${x.color}66;border-left:3px solid ${x.color}" title="${esc(x.title)}">${esc(x.type==='post'?x.brand+' · '+x.title:x.title)}</span>`}function monthGrid(d,social){let start=mon(new Date(d.getFullYear(),d.getMonth(),1,12)),h='<div class="calendar">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let day=plus(start,i),it=items(day,social);h+=`<div class="day ${day.getMonth()!==d.getMonth()?'out':''} ${iso(day)===now()?'today':''}" data-day="${iso(day)}" data-social="${social}"><div class="daynum">${day.getDate()}</div>${it.slice(0,3).map(chip).join('')}${it.length>3?`<small>+${it.length-3} más</small>`:''}</div>`}return h+'</div>'}function weekGrid(d,social){let start=mon(d),h='<div class="week">';for(let i=0;i<7;i++){let day=plus(start,i),it=items(day,social);h+=`<div class="weekdaybox" data-day="${iso(day)}" data-social="${social}"><strong>${day.toLocaleDateString('es-CO',{weekday:'short',day:'numeric'})}</strong>${it.slice(0,5).map(chip).join('')}</div>`}return h+'</div>'}function dayView(d,social){let it=items(d,social);return `<div class="panel"><div class="section"><b>${d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b></div><div class="agenda">${it.length?it.map(x=>`<div class="event" style="border-left-color:${x.color}"><b>${esc(x.title)}</b><small>${x.type==='post'?esc(x.brand)+' · '+esc(x.platform)+' · '+esc(x.format)+' · '+esc(x.status):an(x.area)+(x.tag?' · '+esc(x.tag):'')}</small>${x.type==='post'?`<small>${esc(x.copy||'Sin texto añadido')}</small><button class="btn" data-edit-post="${x.id}">Editar</button> <button class="btn" data-del-post="${x.id}">Eliminar</button>`:x.type==='event'?`<small>${esc(x.tag||'')}${x.notes?' · '+esc(x.notes):''}</small><button class="btn" data-edit-event="${x.id}">Editar</button> <button class="btn" data-del-event="${x.id}">Eliminar</button>`:x.type==='holiday'?`<small>Festivo nacional de Colombia</small>`:''}</div>`).join(''):'<div class="empty">No hay actividades en esta fecha.</div>'}</div></div>`}function calView(social){let d=social?scal:cal,m=social?smode:mode,prefix=social?'s':'c',title=m==='day'?d.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}):m==='week'?'Semana del '+mon(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'}):d.toLocaleDateString('es-CO',{month:'long',year:'numeric'});let h=`<div class="toolbar"><div class="row"><button class="btn" data-nav="${prefix}-prev">‹</button><h3>${title}</h3><button class="btn" data-nav="${prefix}-next">›</button><button class="btn" data-nav="${prefix}-today">Hoy</button></div><div class="row">${['month','week','day'].map(x=>`<button class="btn ${m===x?'active':''}" data-mode="${prefix}-${x}">${({month:'Mes',week:'Semana',day:'Día'})[x]}</button>`).join('')}<button class="btn primary" data-create="${social?'post':'event'}">+ ${social?'Publicación':'Evento'}</button></div></div>`;if(social){let brands=[...new Set(S.posts.map(p=>p.brand))];h+=`<div class="filters"><label>Marca <select id="bf"><option value="all">Todas</option>${brands.map(b=>`<option ${brandfilter===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label><label>Red <select id="pf"><option value="all">Todas</option>${['Instagram','Facebook','TikTok','LinkedIn','YouTube','Otra'].map(p=>`<option ${platformfilter===p?'selected':''}>${p}</option>`).join('')}</select></label></div>`}else h+='<div class="legend">'+A.map(a=>`<span><i class="dot" style="background:${a[3]}"></i>${a[1]}</span>`).join('')+'<span><i class="dot" style="background:#d9c7a8"></i>Festivos de Colombia</span></div>';return h+(m==='month'?monthGrid(d,social):m==='week'?weekGrid(d,social):dayView(d,social))+(social?'<p class="meta">Calendario de planificación; no publica automáticamente en las redes.</p>':'')}
function render(){document.getElementById('sideareas').innerHTML=A.map(a=>`<button class="nav" data-area="${a[0]}">${a[2]} ${a[1]}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let m=document.getElementById('main');if(view==='home'){let tasks=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,5);m.innerHTML=stats()+'<div class="head section"><h3>Tus áreas</h3></div>'+cards()+`<div class="head section"><h3>Próximas tareas</h3><button class="btn primary" data-create="task">+ Nueva tarea</button></div><div class="panel">${taskRows(tasks)}</div><div class="head section"><h3>Nota rápida</h3></div><div class="panel"><textarea id="notes" rows="4" placeholder="Anota una idea...">${esc(S.notes)}</textarea></div>`}else if(view==='tasks'){let ts=S.tasks.filter(t=>!area||t.area===area).sort((a,b)=>(a.done-b.done)||(a.date||'9999').localeCompare(b.date||'9999'));m.innerHTML=`<div class="head section"><h3>${area?an(area):'Todas las tareas'}</h3><button class="btn primary" data-create="task">+ Nueva tarea</button></div><div class="panel">${taskRows(ts)}</div>`}else if(view==='calendar')m.innerHTML=calView(false);else if(view==='social')m.innerHTML=calView(true);else if(view==='notes')m.innerHTML=`<div class="section"><h3>Notas</h3></div><div class="panel"><textarea id="notes" rows="12" placeholder="Escribe aquí...">${esc(S.notes)}</textarea></div>`;else if(view==='areas')m.innerHTML=cards();else if(view==='area'){m.innerHTML=`<div class="head section"><h3>${an(area)}</h3><button class="btn primary" data-create="task">+ Nueva tarea</button><button class="btn" data-create="event">+ Evento</button></div><div class="panel">${taskRows(S.tasks.filter(t=>t.area===area))}</div><div class="section"><h3>Eventos</h3></div><div class="panel">${S.events.filter(e=>e.area===area).map(e=>`<div class="event" style="border-left-color:${ac(e.area)}"><b>${esc(e.title)}</b><small>${label(e.date)} · ${esc(e.tag||'')}</small></div>`).join('')||'<div class="empty">Aún no hay eventos.</div>'}</div>`}bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;area=null;render()});document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{area=b.dataset.area;view='area';render()});document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>openForm(b.dataset.create));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{let t=S.tasks.find(t=>t.id===b.dataset.check);if(t)t.done=b.checked;save();render()});document.querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>openForm('task',b.dataset.editTask));document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{S.tasks=S.tasks.filter(t=>t.id!==b.dataset.delTask);save();render()});document.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{S.events=S.events.filter(t=>t.id!==b.dataset.delEvent);save();render()});document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>openForm('event',b.dataset.editEvent));document.querySelectorAll('[data-del-post]').forEach(b=>b.onclick=()=>{S.posts=S.posts.filter(t=>t.id!==b.dataset.delPost);save();render()});document.querySelectorAll('[data-edit-post]').forEach(b=>b.onclick=()=>openForm('post',b.dataset.editPost));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{let [p,x]=b.dataset.mode.split('-');if(p==='c')mode=x;else smode=x;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let [p,x]=b.dataset.nav.split('-'),d=p==='c'?cal:scal,mo=p==='c'?mode:smode;if(x==='today')d=new Date();else if(mo==='month')d=new Date(d.getFullYear(),d.getMonth()+(x==='next'?1:-1),1,12);else d=plus(d,x==='next'?(mo==='week'?7:1):-(mo==='week'?7:1));if(p==='c')cal=d;else scal=d;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{if(b.dataset.social==='true'){scal=D(b.dataset.day);smode='day';view='social'}else{cal=D(b.dataset.day);mode='day';view='calendar'}render()});let n=document.getElementById('notes');if(n)n.oninput=()=>{S.notes=n.value;save()};let bf=document.getElementById('bf');if(bf)bf.onchange=()=>{brandfilter=bf.value;render()};let pf=document.getElementById('pf');if(pf)pf.onchange=()=>{platformfilter=pf.value;render()}}
function openForm(type,id=null){editing=id;let x=id?(type==='post'?S.posts.find(p=>p.id===id):type==='event'?S.events.find(e=>e.id===id):S.tasks.find(t=>t.id===id)):null;let form=document.getElementById('form');document.getElementById('modtitle').textContent=x?(type==='event'?'Editar evento':type==='task'?'Editar tarea':'Editar publicación'):type==='task'?'Nueva tarea':type==='event'?'Nuevo evento':'Nueva publicación';let areaOpts=A.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');let date=iso(type==='post'?scal:cal);if(type==='task')form.innerHTML=`<div class="field"><label>Tarea</label><input name="title" required maxlength="140" value="${esc(x?.title||'')}" placeholder="¿Qué necesitas hacer?"></div><div class="field"><label>Categoría</label><select name="area">${areaOpts.replace(`value="${x?.area||''}"`, `value="${x?.area||''}" selected`)}</select></div><div class="field"><label>Fecha (opcional)</label><input name="date" type="date" value="${esc(x?.date||'')}"></div><div class="field"><label>Prioridad</label><select name="priority">${['Normal','Alta','Baja'].map(v=>`<option ${x?.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Proyecto o etiqueta</label><input name="project" value="${esc(x?.project||'')}" placeholder="Ej. CreSer"></div><button class="btn primary">Guardar tarea</button>`;else if(type==='event')form.innerHTML=`<div class="field"><label>Nombre del evento</label><input name="title" required maxlength="140" value="${esc(x?.title||'')}" placeholder="Ej. Cita, reunión, entrega"></div><div class="field"><label>Categoría (define el color)</label><select name="area">${A.map(a=>`<option value="${a[0]}" ${x?.area===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" required value="${esc(x?.date||date)}"></div><div class="field"><label>Etiqueta personalizada</label><input name="tag" value="${esc(x?.tag||'')}" placeholder="Importante, cita, entrega"></div><div class="field"><label>Notas</label><textarea name="notes" rows="2">${esc(x?.notes||'')}</textarea></div><button class="btn primary">Guardar evento</button>`;else form.innerHTML=`<div class="field"><label>Título o idea</label><input name="title" required maxlength="140" value="${esc(x?.title||'')}" placeholder="Tema de la publicación"></div><div class="field"><label>Marca o proyecto</label><input name="brand" required value="${esc(x?.brand||'')}" placeholder="Ej. CreSer, otra marca"></div><div class="field"><label>Red social</label><select name="platform">${['Instagram','Facebook','TikTok','LinkedIn','YouTube','Otra'].map(p=>`<option ${x?.platform===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Fecha de publicación</label><input name="date" type="date" required value="${esc(x?.date||date)}"></div><div class="field"><label>Formato</label><select name="format">${['Publicación','Historia','Reel / video corto','Carrusel','Video','Artículo'].map(p=>`<option ${x?.format===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Estado</label><select name="status">${['Idea','Borrador','En preparación','Lista para publicar','Publicada'].map(p=>`<option ${x?.status===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>Copy, hashtags o notas</label><textarea name="copy" rows="4">${esc(x?.copy||'')}</textarea></div><button class="btn primary">Guardar publicación</button>`;form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form).entries());o.id=id||Date.now().toString(36)+Math.random().toString(36).slice(2,6);if(type==='task'){if(id)S.tasks=S.tasks.map(t=>t.id===id?{...t,...o,done:t.done}:t);else{o.done=false;S.tasks.push(o)}}else if(type==='event'){if(id)S.events=S.events.map(e=>e.id===id?o:e);else S.events.push(o)}else if(id)S.posts=S.posts.map(p=>p.id===id?o:p);else S.posts.push(o);save();document.getElementById('modal').classList.remove('open');if(type==='post'){view='social';scal=D(o.date);smode='day'}else if(type==='event'){view='calendar';cal=D(o.date);mode='day'}render()};document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
